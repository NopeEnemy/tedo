[package]
name = "tedo"
version = "2.1.0"
edition = "2024"
description = "Tedo is a simple terminal TO-DO manager for people who don't like GUIs."
license = "MIT"
readme = "README.md"
repository = "https://github.com/NopeEnemy/tedo"
keywords = ["cli", "tool", "to-do", "tasks"]
categories = ["command-line-utilities"]

[[bin]]
name = "tedo"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap-markdown = "0.1.5"
dirs = "7.0.0"
duration-str = "0.21.0"
fundu = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[profile.release]
panic = 'abort'
