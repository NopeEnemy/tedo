[package]
name = "tedo"
version = "1.5.0"
edition = "2024"
description = "Tedo is a simple terminal TO-DO manager for people who don't like GUIs."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/NopeEnemy/tedo"
keywords = ["cli", "tool", "to-do", "tasks"]
categories = ["command-line-utilities"]

[[bin]]
name = "tedo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[profile.release]
panic = 'abort'
